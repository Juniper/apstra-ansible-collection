# ── Apstra version registry ───────────────────────────────────────────────────
# Add new Apstra versions here — no changes to run_matrix.sh required.
#
# VERSION_ORDER   space-separated list; controls column order in the output table
# VER_URL_<key>   API base URL for that version
# DEVICE_IP_<key> spine1 / test device IP for device_management + os_upgrade tests
#                 leave empty ("") when agents are already connected on that server
#
# Key encoding: replace dots with underscores (6.1.1 → 6_1_1)
# ─────────────────────────────────────────────────────────────────────────────

VERSION_ORDER="6.0 6.1 6.1.1 6.1.2"

VER_URL_6_0="https://10.88.137.77/api"
VER_URL_6_1="https://10.88.137.214/api"
VER_URL_6_1_1="https://10.204.22.126/api"
VER_URL_6_1_2="https://10.88.137.230/api"

# Device IPs — leave empty when spine1 is already connected on that server
DEVICE_IP_6_0="192.158.166.11"
DEVICE_IP_6_1=""
DEVICE_IP_6_1_1=""
DEVICE_IP_6_1_2="192.159.3.11"

# ── Example: adding Apstra 6.2 ────────────────────────────────────────────────
# VERSION_ORDER="6.0 6.1 6.1.1 6.1.2 6.2"
# VER_URL_6_2="https://10.88.137.XXX/api"
# DEVICE_IP_6_2="192.158.XXX.XXX"   # or "" if already connected
